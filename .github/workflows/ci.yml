name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Build
        run: pnpm build

      - name: Typescript check
        run: pnpm tsc

      - name: Lint code
        run: pnpm lint

      - name: Prettify code
        run: pnpm format:check

      - name: Run tests
        run: pnpm test
